<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- HEADER -->
    <header>
        <button onclick="toggleTheme()" class="theme-toggle">🌙</button>
        <div class="header-content">
            <h1>🛒 Kasir Scan</h1>
            <p id="datetime"></p>
        </div>
    </header>

    <!-- SCAN SECTION -->
    <div class="card">
        <div id="cameraStatus" class="camera-status">📷 Pilih metode scan di bawah</div>

        <!-- Pilihan Metode -->
        <div class="method-tabs">
            <button class="tab active" onclick="switchMethod('manual')">⌨️ Manual</button>
            <button class="tab" onclick="switchMethod('upload')">📷 Upload</button>
            <button class="tab" onclick="switchMethod('camera')">📹 Kamera</button>
        </div>

        <!-- Manual Input -->
        <div id="methodManual" class="method-content active">
            <div class="input-group">
                <input type="text" id="barcodeInput" placeholder="Ketik kode barang..." autofocus />
                <button class="btn-add" onclick="addItemByBarcode()">Tambah</button>
            </div>
        </div>

        <!-- Upload Foto -->
        <div id="methodUpload" class="method-content">
            <div class="upload-area" id="uploadArea">
                <span>📸</span>
                <p>Klik untuk upload foto barcode</p>
                <small>PNG, JPG, WebP</small>
                <input type="file" id="fileInput" accept="image/*" capture="environment" />
            </div>
            <div id="uploadResult" class="scan-result"></div>
        </div>

        <!-- Camera Live -->
        <div id="methodCamera" class="method-content">
            <div class="camera-container" id="cameraContainer">
                <video id="video" autoplay playsinline muted></video>
                <div class="camera-overlay" id="cameraOverlay">
                    <span>📷 Arahkan ke Barcode</span>
                    <small>Otomatis berhenti 15 detik</small>
                </div>
                <div class="camera-placeholder" id="cameraPlaceholder">
                    <span>📷</span>
                    <p>Klik tombol di bawah</p>
                </div>
            </div>
            <button id="btnScan" class="btn-scan" onclick="toggleCamera()">📷 Mulai Kamera</button>
        </div>

        <!-- Search & Category Filter -->
        <div class="filter-section">
            <input type="text" id="searchInput" placeholder="Cari produk..." oninput="searchProduct()" />
            <div class="category-filter">
                <button onclick="filterCategory('all')" class="cat-btn active" data-cat="all">Semua</button>
                <button onclick="filterCategory('Makanan')" class="cat-btn" data-cat="Makanan">🍜</button>
                <button onclick="filterCategory('Minuman')" class="cat-btn" data-cat="Minuman">🥤</button>
                <button onclick="filterCategory('Snack')" class="cat-btn" data-cat="Snack">🍿</button>
                <button onclick="filterCategory('Rokok')" class="cat-btn" data-cat="Rokok">🚬</button>
                <button onclick="filterCategory('Lainnya')" class="cat-btn" data-cat="Lainnya">📦</button>
            </div>
        </div>

        <!-- Quick Products -->
        <div class="quick-products" id="quickProducts"></div>

        <!-- Tambah Produk Baru -->
        <div class="add-product">
            <h4>➕ Tambah Produk</h4>
            <div class="add-product-form">
                <input type="text" id="newBarcode" placeholder="Kode" />
                <input type="text" id="newName" placeholder="Nama" />
                <select id="newCategory">
                    <option value="Makanan">🍜 Makanan</option>
                    <option value="Minuman">🥤 Minuman</option>
                    <option value="Snack">🍿 Snack</option>
                    <option value="Rokok">🚬 Rokok</option>
                    <option value="Lainnya">📦 Lainnya</option>
                </select>
                <input type="number" id="newPrice" placeholder="Harga" />
                <button onclick="addNewProduct()">+</button>
            </div>
        </div>
    </div>

    <!-- CART SECTION -->
    <div class="card">
        <h2>🧾 Daftar Belanjaan</h2>
        <div id="cartList"><div class="empty-cart">🛒 Belum ada barang</div></div>

        <div class="total-section">
            <div class="total-row">
                <span>Subtotal</span>
                <span id="subtotal">Rp 0</span>
            </div>
            <div class="total-row">
                <span>Diskon</span>
                <div class="discount-group">
                    <input type="number" id="discountInput" value="0" min="0" max="100" />
                    <span>%</span>
                </div>
            </div>
            <div class="total-row">
                <span>Potongan</span>
                <span id="discountAmount">Rp 0</span>
            </div>
            <div class="total-row grand-total">
                <span>Total</span>
                <span id="grandTotal">Rp 0</span>
            </div>
            
            <!-- Pembayaran -->
            <div class="total-row payment-row">
                <span>Uang Bayar</span>
                <input type="number" id="paymentInput" value="0" min="0" />
            </div>
            <div class="total-row change-row">
                <span>Kembalian</span>
                <span id="changeAmount">Rp 0</span>
            </div>

            <div class="total-actions">
                <button class="btn-clear" onclick="clearCart()">🗑️</button>
                <button class="btn-print" onclick="printReceipt()">🖨️</button>
                <button class="btn-save" onclick="saveData()">💾</button>
                <button class="btn-load" onclick="loadData()">📂</button>
                <button class="btn-history" onclick="viewHistory()">📊</button>
                <button class="btn-excel" onclick="exportExcel()">📈</button>
            </div>
        </div>
    </div>

    <!-- Library untuk scan dari gambar -->
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

    <script src="script.js"></script>
</body>
</html>
