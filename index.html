<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    
    <!-- jsQR untuk scan barcode -->
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

    <link rel="stylesheet" href="style.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f7fa',
                            100: '#d9ecf2',
                            200: '#b3d9e5',
                            300: '#8cc6d8',
                            400: '#66b3cb',
                            500: '#1a5f7a',
                            600: '#154c62',
                            700: '#103949',
                            800: '#0a2631',
                            900: '#051318',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-300">

    <!-- HEADER -->
    <header class="relative bg-gradient-to-r from-[#0f2a44] to-[#1a5f7a] text-white rounded-2xl p-5 mb-4 shadow-xl shadow-[#0f2a44]/20">
        <button @click="toggleTheme()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 transition-all duration-200 flex items-center justify-center text-lg">
            <span x-text="darkMode ? '☀️' : '🌙'"></span>
        </button>
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight">🛒 Kasir Scan</h1>
            <p class="text-sm opacity-80 mt-1" x-text="datetime"></p>
        </div>
    </header>

    <!-- SCAN SECTION -->
    <div class="bg-white dark:bg-[#15202b] rounded-2xl p-4 md:p-5 mb-4 shadow-sm transition-all duration-300 card-hover" id="scanSection">
        
        <!-- Status -->
        <div class="flex items-center gap-3 px-4 py-3 rounded-xl mb-4 transition-all duration-300"
             :class="{
                'bg-amber-50 dark:bg-amber-950/30 border-l-4 border-amber-400': status.type === 'info',
                'bg-emerald-50 dark:bg-emerald-950/30 border-l-4 border-emerald-500': status.type === 'success',
                'bg-red-50 dark:bg-red-950/30 border-l-4 border-red-500': status.type === 'error',
                'bg-blue-50 dark:bg-blue-950/30 border-l-4 border-blue-500': status.type === 'active'
             }">
            <span class="text-lg" x-text="status.icon || '📷'"></span>
            <span class="text-sm font-medium dark:text-gray-200" x-text="status.message"></span>
        </div>

        <!-- Method Tabs -->
        <div class="flex gap-1 p-1 bg-gray-100 dark:bg-[#0f1a24] rounded-xl mb-4">
            <template x-for="method in methods" :key="method.id">
                <button @click="switchMethod(method.id)"
                        class="flex-1 py-2.5 px-3 rounded-lg text-sm font-semibold transition-all duration-200"
                        :class="activeMethod === method.id ? 
                                'bg-white dark:bg-[#1a2835] text-gray-900 dark:text-white shadow-md' : 
                                'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'">
                    <span x-text="method.icon + ' ' + method.label"></span>
                </button>
            </template>
        </div>

        <!-- Method Content -->
        <div class="transition-all duration-300">
            
            <!-- Manual Input -->
            <div x-show="activeMethod === 'manual'" x-transition.duration.200>
                <div class="flex gap-2 flex-wrap">
                    <input type="text" id="barcodeInput" x-model="barcodeInput" 
                           placeholder="Ketik kode barang..." 
                           @keydown.enter="addItem()"
                           class="flex-1 min-w-[120px] px-4 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white focus:border-[#1a5f7a] focus:ring-4 focus:ring-[#1a5f7a]/10 outline-none transition-all duration-200 text-sm">
                    <button @click="addItem()"
                            class="px-6 py-3 bg-[#1a5f7a] hover:bg-[#154c62] text-white font-semibold rounded-xl transition-all duration-200 hover:shadow-lg hover:shadow-[#1a5f7a]/25 text-sm whitespace-nowrap">
                        ➕ Tambah
                    </button>
                </div>
            </div>

            <!-- Upload Foto -->
            <div x-show="activeMethod === 'upload'" x-transition.duration.200>
                <div class="border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-xl p-8 text-center cursor-pointer hover:border-[#1a5f7a] dark:hover:border-[#4a8aaa] transition-all duration-300 bg-gray-50/50 dark:bg-[#0f1a24]/50 hover:bg-gray-100/50 dark:hover:bg-[#1a2835]/50 relative">
                    <span class="text-5xl block mb-2">📸</span>
                    <p class="text-gray-600 dark:text-gray-400 font-medium">Klik untuk upload foto barcode</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">PNG, JPG, WebP</p>
                    <input type="file" id="fileInput" accept="image/*" capture="environment" 
                           @change="handleUpload($event)" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
                <div x-show="uploadResult.message" 
                     class="mt-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300"
                     :class="{
                        'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-400 border-l-4 border-emerald-500': uploadResult.type === 'success',
                        'bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-400 border-l-4 border-red-500': uploadResult.type === 'error'
                     }"
                     x-text="uploadResult.message">
                </div>
            </div>

            <!-- Camera Live -->
            <div x-show="activeMethod === 'camera'" x-transition.duration.200>
                <div class="relative w-full aspect-[4/3] bg-[#0f1724] rounded-xl overflow-hidden mb-3 min-h-[180px]">
                    <video id="video" autoplay playsinline muted class="w-full h-full object-cover hidden" :class="{'!block': cameraActive}"></video>
                    <div class="absolute inset-0 flex items-center justify-center flex-col text-white/80 pointer-events-none border-2 border-white/30 rounded-xl transition-all duration-300"
                         :class="{'!flex': cameraActive, 'hidden': !cameraActive}">
                        <span class="text-lg">📷 Arahkan ke Barcode</span>
                        <span class="text-xs opacity-60 mt-1">Otomatis berhenti 15 detik</span>
                    </div>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-white/30 bg-[#0f1724] rounded-xl"
                         :class="{'hidden': cameraActive}">
                        <span class="text-5xl mb-1">📷</span>
                        <p class="text-sm">Klik tombol di bawah</p>
                    </div>
                </div>
                <button @click="toggleCamera()"
                        class="w-full py-3 rounded-xl font-semibold text-sm transition-all duration-200"
                        :class="cameraActive ? 
                                'bg-red-500 hover:bg-red-600 text-white' : 
                                'bg-[#0f2a44] hover:bg-[#1a3d5c] text-white'">
                    <span x-text="cameraActive ? '⏹️ Berhenti' : '📷 Mulai Kamera'"></span>
                </button>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="mt-4 space-y-2">
            <input type="text" x-model="searchQuery" @input="searchProduct()"
                   placeholder="🔍 Cari produk..." 
                   class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white focus:border-[#1a5f7a] focus:ring-4 focus:ring-[#1a5f7a]/10 outline-none transition-all duration-200 text-sm">
            
            <div class="flex gap-1.5 flex-wrap">
                <template x-for="cat in categories" :key="cat.id">
                    <button @click="filterCategory(cat.id)"
                            class="px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200"
                            :class="activeCategory === cat.id ? 
                                    'bg-[#1a5f7a] text-white shadow-md' : 
                                    'border-2 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:border-[#1a5f7a] dark:hover:border-[#4a8aaa]'">
                        <span x-text="cat.icon + ' ' + cat.label"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Quick Products -->
        <div class="flex flex-wrap gap-1.5 mt-3" id="quickProducts">
            <template x-for="product in filteredProducts" :key="product.code">
                <button @click="quickAdd(product.code)"
                        class="px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 dark:bg-[#1a2835] text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-[#1a5f7a] hover:text-white hover:border-[#1a5f7a] transition-all duration-200">
                    <span x-text="product.name"></span>
                </button>
            </template>
        </div>

        <!-- Add Product -->
        <div class="mt-4 pt-4 border-t-2 border-gray-100 dark:border-gray-800">
            <h4 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">➕ Tambah Produk</h4>
            <div class="flex gap-1.5 flex-wrap">
                <input type="text" x-model="newProduct.barcode" placeholder="Kode" class="flex-1 min-w-[60px] px-3 py-2 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:border-[#1a5f7a] outline-none transition-all">
                <input type="text" x-model="newProduct.name" placeholder="Nama" class="flex-1 min-w-[60px] px-3 py-2 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:border-[#1a5f7a] outline-none transition-all">
                <select x-model="newProduct.category" class="px-3 py-2 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:border-[#1a5f7a] outline-none transition-all">
                    <option value="Makanan">🍜 Makanan</option>
                    <option value="Minuman">🥤 Minuman</option>
                    <option value="Snack">🍿 Snack</option>
                    <option value="Rokok">🚬 Rokok</option>
                    <option value="Lainnya">📦 Lainnya</option>
                </select>
                <input type="number" x-model="newProduct.price" placeholder="Harga" class="w-20 px-3 py-2 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:border-[#1a5f7a] outline-none transition-all">
                <button @click="addNewProduct()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-lg transition-all duration-200 text-sm">+</button>
            </div>
        </div>
    </div>

    <!-- CART SECTION -->
    <div class="bg-white dark:bg-[#15202b] rounded-2xl p-4 md:p-5 shadow-sm transition-all duration-300 card-hover">
        <h2 class="text-base font-semibold text-gray-800 dark:text-gray-200 mb-3 pb-2 border-b-2 border-gray-100 dark:border-gray-800">🧾 Daftar Belanjaan</h2>
        
        <!-- Cart Items -->
        <div class="max-h-72 overflow-y-auto mb-3 space-y-1" id="cartList">
            <template x-if="cart.length === 0">
                <div class="text-center text-gray-400 dark:text-gray-600 py-6 text-sm">🛒 Belum ada barang</div>
            </template>
            <template x-for="(item, idx) in cart" :key="item.id">
                <div class="flex items-center justify-between gap-2 p-3 bg-gray-50 dark:bg-[#1a2835] rounded-xl border-l-4 border-[#1a5f7a] transition-all duration-200 hover:bg-gray-100 dark:hover:bg-[#1f3040] fade-in">
                    <span class="font-medium text-sm text-gray-800 dark:text-gray-200 flex-1 min-w-[50px]" x-text="item.name"></span>
                    <span class="font-semibold text-sm text-[#1a5f7a] dark:text-[#5a9ab8]" x-text="'Rp ' + formatNumber(item.price)"></span>
                    <div class="flex items-center gap-1">
                        <button @click="changeQty(item.id, -1)" class="w-6 h-6 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold text-sm transition-all">−</button>
                        <span class="w-5 text-center font-semibold text-sm" x-text="item.qty"></span>
                        <button @click="changeQty(item.id, 1)" class="w-6 h-6 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold text-sm transition-all">+</button>
                    </div>
                    <span class="font-bold text-sm text-gray-800 dark:text-gray-200 min-w-[55px] text-right" x-text="'Rp ' + formatNumber(item.price * item.qty)"></span>
                    <button @click="removeItem(item.id)" class="text-red-500 hover:text-red-700 text-base font-bold px-1 transition-all">✕</button>
                </div>
            </template>
        </div>

        <!-- Total -->
        <div class="space-y-1.5 pt-2 border-t-2 border-gray-100 dark:border-gray-800">
            <div class="flex justify-between text-sm">
                <span class="text-gray-600 dark:text-gray-400">Subtotal</span>
                <span class="font-semibold text-gray-800 dark:text-gray-200" x-text="'Rp ' + formatNumber(subtotal)"></span>
            </div>
            <div class="flex justify-between text-sm items-center">
                <span class="text-gray-600 dark:text-gray-400">Diskon</span>
                <div class="flex items-center gap-1.5">
                    <input type="number" x-model="discount" min="0" max="100" 
                           class="w-14 px-2 py-1 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm text-right focus:border-[#1a5f7a] outline-none transition-all">
                    <span class="text-gray-600 dark:text-gray-400 text-sm">%</span>
                </div>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-600 dark:text-gray-400">Potongan</span>
                <span class="font-semibold text-red-500" x-text="'- Rp ' + formatNumber(discountAmount)"></span>
            </div>
            <div class="flex justify-between text-lg font-bold text-gray-800 dark:text-gray-200 pt-2 border-t-2 border-gray-100 dark:border-gray-800">
                <span>Total</span>
                <span x-text="'Rp ' + formatNumber(grandTotal)"></span>
            </div>
            
            <!-- Payment -->
            <div class="flex justify-between text-sm items-center pt-2 border-t-2 border-gray-100 dark:border-gray-800">
                <span class="text-gray-600 dark:text-gray-400">💰 Uang Bayar</span>
                <input type="number" x-model="payment" min="0" 
                       class="w-24 px-2 py-1.5 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm text-right focus:border-[#1a5f7a] outline-none transition-all">
            </div>
            <div class="flex justify-between text-base font-bold" :class="change >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500'">
                <span>🔄 Kembalian</span>
                <span x-text="change >= 0 ? 'Rp ' + formatNumber(change) : '❌ Kurang'"></span>
            </div>

            <!-- Actions -->
            <div class="flex gap-1.5 mt-3 flex-wrap">
                <button @click="clearCart()" class="flex-1 min-w-[36px] py-2.5 rounded-xl bg-gray-100 dark:bg-[#1a2835] hover:bg-gray-200 dark:hover:bg-[#253544] text-gray-600 dark:text-gray-400 font-semibold text-sm transition-all">🗑️</button>
                <button @click="printReceipt()" class="flex-1 min-w-[36px] py-2.5 rounded-xl bg-[#1a5f7a] hover:bg-[#154c62] text-white font-semibold text-sm transition-all hover:shadow-lg hover:shadow-[#1a5f7a]/25">🖨️</button>
                <button @click="saveData()" class="flex-1 min-w-[36px] py-2.5 rounded-xl bg-gray-500 hover:bg-gray-600 text-white font-semibold text-sm transition-all">💾</button>
                <button @click="loadData()" class="flex-1 min-w-[36px] py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-600 text-white font-semibold text-sm transition-all">📂</button>
                <button @click="viewHistory()" class="flex-1 min-w-[36px] py-2.5 rounded-xl bg-purple-500 hover:bg-purple-600 text-white font-semibold text-sm transition-all">📊</button>
                <button @click="exportExcel()" class="flex-1 min-w-[36px] py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-sm transition-all">📈</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
